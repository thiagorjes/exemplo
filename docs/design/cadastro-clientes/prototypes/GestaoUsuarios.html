<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Protótipo — Gestão de usuários — cadastro-clientes</title>
<style>
  :root{
    --background:#ffffff; --foreground:#374151;
    --primary:#004b8d; --primary-hover:#003564; --primary-foreground:#ffffff;
    --secondary-border:#e5e7eb; --ghost-hover:#e6edf4; --ghost-foreground:#004b8d;
    --destructive:#fef2f2; --destructive-border:#fca5a5; --destructive-foreground:#991b1b;
    --success-bg:#ecfdf5; --success-fg:#047857;
    --ring:#004b8d;
    --radius-lg:8px; --radius-xl:12px; --radius-md:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#f3f4f6;color:var(--foreground);}
  .stage{width:1440px;min-height:900px;margin:0 auto;background:var(--background);position:relative;}
  .navbar{height:80px;border-bottom:1px solid var(--secondary-border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;}
  .brand{font-weight:600;font-size:18px;color:var(--primary);}
  .role{font-size:14px;color:#85888E;}
  .content{padding:32px;display:grid;grid-template-columns:400px 1fr;gap:32px;}
  h1{font-size:24px;font-weight:600;margin:0 0 20px;grid-column:1/-1;}
  .card{border:1px solid var(--secondary-border);border-radius:var(--radius-xl);padding:24px;}
  h2{font-size:18px;font-weight:600;margin:0 0 16px;}
  .field{margin-bottom:20px;}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;}
  input{width:100%;height:44px;padding:0 12px;font-size:14px;border:1px solid var(--secondary-border);border-radius:var(--radius-md);font-family:inherit;}
  input:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 2px var(--ring);}
  .error-text{font-size:12px;color:var(--destructive-foreground);margin-top:6px;display:none;}
  .field.has-error input{border-color:var(--destructive-border);}
  .field.has-error .error-text{display:block;}
  .btn{height:44px;padding:0 16px;border-radius:var(--radius-lg);font-size:16px;font-weight:500;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
  .btn-primary{background:var(--primary);color:var(--primary-foreground);width:100%;}
  .btn-primary:disabled{opacity:.7;cursor:default;}
  .spinner{width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-weight:600;color:#85888E;font-size:12px;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--secondary-border);}
  td{padding:12px;border-bottom:1px solid var(--secondary-border);}
  .empty, .skeleton-row td{color:#85888E;text-align:center;padding:40px;}
  .skeleton-row td{background:linear-gradient(90deg,#f3f4f6 25%,#e5e7eb 50%,#f3f4f6 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;color:transparent;border-radius:4px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .alert{display:none;border:1px solid var(--destructive-border);background:var(--destructive);color:var(--destructive-foreground);border-radius:var(--radius-md);padding:12px;font-size:14px;margin-bottom:16px;}
  .alert.show{display:block;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--success-bg);color:var(--success-fg);border:1px solid #a7f3d0;padding:12px 16px;border-radius:var(--radius-md);font-size:14px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .toast.show{display:block;}
  .devpanel{position:fixed;top:16px;right:16px;background:#111827;color:#fff;padding:12px;border-radius:8px;font-size:12px;z-index:999;}
  .devpanel b{display:block;margin-bottom:8px;}
  .devpanel button{margin:2px;padding:6px 10px;border-radius:6px;border:1px solid #374151;background:#1f2937;color:#fff;cursor:pointer;font-size:12px;}
  .devpanel button.active{background:var(--primary);border-color:var(--primary);}
</style>
</head>
<body>

<div class="devpanel">
  <b>Estado (dev) — lista de usuários</b>
  <button data-state="idle" class="active">Idle (com dados)</button>
  <button data-state="loading">Loading</button>
  <button data-state="erro">Erro</button>
  <button data-state="vazio">Vazio</button>
</div>

<div class="stage">
  <div class="navbar">
    <span class="brand">Banestes — Cadastro de Clientes</span>
    <span class="role">Admin global</span>
  </div>

  <div class="content">
    <h1>Gestão de usuários</h1>

    <div class="card">
      <h2>Criar usuário</h2>
      <form onsubmit="return false;">
        <div class="field" id="fieldCpf">
          <label>CPF</label>
          <input id="cpf" placeholder="000.000.000-00">
          <div class="error-text">Informe um CPF válido.</div>
        </div>
        <div class="field" id="fieldSenha">
          <label>Senha</label>
          <input id="senha" type="password" placeholder="Defina uma senha">
          <div class="error-text">A senha precisa ter ao menos 8 caracteres.</div>
        </div>
        <button class="btn btn-primary" id="btnCriar" onclick="criarUsuario()">
          <span class="spinner" id="spinner"></span>
          <span id="btnLabel">Criar usuário</span>
        </button>
      </form>
    </div>

    <div class="card">
      <h2>Usuários cadastrados</h2>
      <div class="alert" id="alertErro">Não foi possível carregar a lista de usuários.</div>
      <table>
        <thead><tr><th>CPF</th><th>Criado em</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast">Usuário criado com sucesso.</div>

<script>
  // Dados de mock
  const USUARIOS = [
    { cpf: "123.456.789-00", criadoEm: "20/10/2026" },
    { cpf: "987.654.321-00", criadoEm: "21/10/2026" },
  ];

  function renderTable(state){
    const tbody = document.getElementById('tbody');
    const alertErro = document.getElementById('alertErro');
    alertErro.classList.remove('show');
    tbody.innerHTML = '';

    if (state === 'loading') {
      for (let i=0;i<3;i++){
        tbody.innerHTML += `<tr class="skeleton-row"><td>carregando</td><td>carregando</td></tr>`;
      }
      return;
    }
    if (state === 'erro') {
      alertErro.classList.add('show');
      return;
    }
    if (state === 'vazio') {
      tbody.innerHTML = `<tr><td colspan="2" class="empty">Nenhum usuário cadastrado além do admin global.</td></tr>`;
      return;
    }
    USUARIOS.forEach(u => {
      tbody.innerHTML += `<tr><td>${u.cpf}</td><td>${u.criadoEm}</td></tr>`;
    });
  }

  function setState(state){
    document.querySelectorAll('.devpanel button').forEach(b => b.classList.toggle('active', b.dataset.state === state));
    renderTable(state);
  }

  function criarUsuario(){
    const cpf = document.getElementById('cpf');
    const senha = document.getElementById('senha');
    const fieldCpf = document.getElementById('fieldCpf');
    const fieldSenha = document.getElementById('fieldSenha');
    fieldCpf.classList.toggle('has-error', !cpf.value);
    fieldSenha.classList.toggle('has-error', !senha.value || senha.value.length < 8);
    if (!cpf.value || !senha.value || senha.value.length < 8) return;

    const btn = document.getElementById('btnCriar');
    const spinner = document.getElementById('spinner');
    const label = document.getElementById('btnLabel');
    btn.disabled = true; spinner.style.display='inline-block'; label.style.display='none';

    setTimeout(() => {
      btn.disabled = false; spinner.style.display='none'; label.style.display='inline';
      USUARIOS.unshift({ cpf: cpf.value, criadoEm: "22/10/2026" });
      renderTable('idle');
      cpf.value=''; senha.value='';
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'), 2500);
    }, 900);
  }

  document.querySelectorAll('.devpanel button').forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
  renderTable('idle');
</script>
</body>
</html>
